<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside id="side" aria-label="Chat history">
  <button id="new">＋ New chat</button>
  <nav id="list"></nav>
</aside>
<div id="scrim"></div>
<div id="main">
  <header>
    <button class="ic" id="menu" aria-label="Open menu">☰</button>
    <h1 id="title">New chat</h1>
    <button class="ic" id="theme" aria-label="Toggle dark mode">◐</button>
  </header>
  <div id="chat" aria-live="polite"><div class="wrap" id="msgs"></div></div>
  <footer>
    <div id="box">
      <textarea id="in" rows="1" placeholder="Message AI…" maxlength="8000" aria-label="Message"></textarea>
      <button id="send" aria-label="Send">➤</button>
    </div>
    <p class="note">AI responses may contain mistakes.</p>
  </footer>
</div>

<script src="config.js"></script>
<script src="script.js"></script>
</body>
</html>
